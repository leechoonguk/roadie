<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!-- react-native-web writes its styles into a <style> element, hence 'unsafe-inline' for styles only. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>Roadie</title>
    <style>
      /* The screens draw with app/src/theme.ts; this only covers the frame before they do. */
      :root {
        color-scheme: light dark;
        --window: #f5f5f7;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --window: #1c1c1e;
        }
      }
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
        display: flex;
        flex-direction: column;
        background: var(--window);
        font-family: system-ui, 'Segoe UI', Ubuntu, Cantarell, sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="renderer.js"></script>
  </body>
</html>
